name: 'Tiny Tapeout GDS Action for the ULX3S and ULX4M ECP5 FPGA'
description: 'Generate an ECP5 FPGA bitstream from a Tiny Tapeout project for ULX3S or ULX4M'

branding:
  color: purple
  icon: cpu

inputs:
  board:
    description: 'Target board (ulx3s or ulx4m)'
    default: 'ulx3s'
    required: false

  tools-repo:
    description: 'Override tt-support-tools repository; leave empty for the board default'
    default: ''
    required: false

  tools-ref:
    description: 'Override tt-support-tools branch, tag, or commit'
    default: 'experimental'
    required: false
    type: string
  pdk:
    description: 'PDK used for hardening the chip'
    required: true
    type: choice
    options:
      - 'gf180mcuD'
      - 'ihp-sg13g2'
      - 'sky130A'
  librelane-version:
    description: 'LibreLane version to install'
    default: '3.0.14'

  oss-cad-suite-version:
    description: 'OSS CAD Suite release version (YYYY-MM-DD)'
    required: false
    default: '2026-07-20'

  ecp5-device:
    description: 'ECP5 device size (25k, 45k, 85k)'
    default: '85k'
    required: false

  lpf:
    description: 'LPF constraints path; leave empty for the board default'
    default: ''
    required: false

  artifact-name:
    description: 'Artifact base name; leave empty for the board default'
    default: ''
    required: false

  uart-enabled:
    description: 'Enable UART pin mapping in the FPGA wrapper'
    default: 'true'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Validate FPGA board
      shell: bash
      run: |
        case "${{ inputs.board }}" in
            ulx3s|ulx4m)
                ;;
            *)
                echo "::error::Unsupported board '${{ inputs.board }}'; expected 'ulx3s' or 'ulx4m'."
                exit 1
                ;;
        esac

    - name: Build ULX3S ECP5 bitstream
      if: ${{ inputs.board == 'ulx3s' }}
      uses: $/fpga/ulx3s
      with:
        tools-repo: ${{ inputs.tools-repo || 'ulx3s/tt-support-tools' }}
        tools-ref: ${{ inputs.tools-ref }}
        oss-cad-suite-version: ${{ inputs.oss-cad-suite-version }}
        ecp5-device: ${{ inputs.ecp5-device }}
        lpf: ${{ inputs.lpf || 'tt/fpga/ulx3s/ulx3s_v20.lpf' }}
        artifact-name: ${{ inputs.artifact-name || 'fpga_ulx3s_ecp5' }}
        uart-enabled: ${{ inputs.uart-enabled }}

    - name: Build ULX4M ECP5 bitstream
      if: ${{ inputs.board == 'ulx4m' }}
      uses: $/fpga/ulx4m
      with:
        tools-repo: ${{ inputs.tools-repo || 'ulx3s/tt-support-tools' }}
        tools-ref: ${{ inputs.tools-ref }}
        oss-cad-suite-version: ${{ inputs.oss-cad-suite-version }}
        ecp5-device: ${{ inputs.ecp5-device }}
        lpf: ${{ inputs.lpf || 'tt/fpga/ulx4m/ulx4m_ls_v003.lpf' }}
        artifact-name: ${{ inputs.artifact-name || 'fpga_ulx4m_ecp5' }}
        uart-enabled: ${{ inputs.uart-enabled }}
